version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    container_name: ${PROJECT_NAME}_backend
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - PORT=${BACKEND_PORT}
    volumes:
      - ./apps/backend:/app/apps/backend:cached
      - ./packages:/app/packages:cached
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - backend_node_modules:/app/node_modules
      - backend_app_node_modules:/app/apps/backend/node_modules
    networks:
      - app-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *default-logging
    command: sh -c "pnpm install --frozen-lockfile || pnpm install && cd apps/backend && pnpm prisma:generate && cd ../.. && pnpm --filter @kaion/backend dev"

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: deps
    container_name: ${PROJECT_NAME}_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_API_URL=/api
      - PORT=3000
      - WATCHPACK_POLLING=true
    volumes:
      - ./apps/frontend:/app/apps/frontend:cached
      - ./packages:/app/packages:cached
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - frontend_node_modules:/app/node_modules
      - frontend_app_node_modules:/app/apps/frontend/node_modules
      - frontend_next:/app/apps/frontend/.next
    networks:
      - app-network
    depends_on:
      - backend
    logging: *default-logging
    command: sh -c "pnpm install --frozen-lockfile || pnpm install && pnpm --filter @kaion/frontend dev"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}_nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - frontend
      - backend
    logging: *default-logging

  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: ${PROJECT_NAME}_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network
    logging: *default-logging

  # Adminer (Database UI)
  adminer:
    image: adminer
    container_name: ${PROJECT_NAME}_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - app-network
    environment:
      - ADMINER_DEFAULT_SERVER=database
    logging: *default-logging

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  backend_app_node_modules:
  frontend_node_modules:
  frontend_app_node_modules:
  frontend_next:
