events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:3001;
    }

    server {
        listen 80;
        server_name _;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Next.js dev server specific
            proxy_buffering off;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint
        # Stage 4 MON-004 fix (2026-04-15): NestJS는 setGlobalPrefix('api')로
        # 모든 라우트가 /api 접두사. 따라서 /health → backend/api/health 으로 정정.
        # 이전엔 backend/health 으로 proxy 했으나 backend는 404 반환.
        location /health {
            proxy_pass http://backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Stage 4 MON-002 (2026-04-15): access_log + error_log 명시.
        # 이전엔 지시어 부재로 default(stdout/stderr)였고 로그 형식 통일성 부족.
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;
    }
}
